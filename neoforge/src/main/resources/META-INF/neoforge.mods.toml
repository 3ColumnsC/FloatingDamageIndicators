modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/3ColumnsC/FloatingDamageIndicators/issues"

[[mods]]
modId = "floatingdamageindicators"
version = "${file.jarVersion}"
displayName = "Floating Damage Indicators"
authors = "3C Team"
description = '''
Adds floating damage numbers above every target you hit, and your own incoming damage too. Color-coded by damage type.
'''
iconFile = "assets/floatingdamageindicators/icon.png"
bannerFile = "assets/floatingdamageindicators/icon.png"
displayURL = "https://modrinth.com/mod/floating-damage-indicators"

[[mixins]]
config = "floatingdamageindicators.mixins.json"
side = "CLIENT"

[[mixins]]
config = "floatingdamageindicators-server.mixins.json"
side = "SERVER"

[[dependencies.floatingdamageindicators]]
modId = "neoforge"
type = "required"
versionRange = "[26.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.floatingdamageindicators]]
modId = "minecraft"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "BOTH"
